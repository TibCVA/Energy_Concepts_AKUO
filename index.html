<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVA × Akuo — Fondamentaux Énergie Renouvelable</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0C2340;--navy-light:#1A3A5C;--teal:#0E7C7B;--teal-light:#11A6A5;
  --amber:#D4952A;--red:#C4384B;--green:#2A7F62;--slate:#3E5060;
  --text:#1E293B;--text-mid:#475569;--text-light:#64748B;
  --bg:#F6F7F9;--card:#FFFFFF;--border:#E2E6EC;--border-light:#EEF1F5;
  --highlight:#E8F4F8;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
p{margin:0 0 8px;line-height:1.7;}

/* HEADER */
.header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 50%,var(--teal) 100%);color:#fff;padding:24px 32px 20px;flex-shrink:0;}
.header-inner{display:flex;justify-content:space-between;align-items:flex-start;}
.header-tag{font-size:10px;text-transform:uppercase;letter-spacing:2px;opacity:0.6;font-family:'DM Mono',monospace;margin-bottom:8px;}
.header h1{font-size:22px;font-weight:800;letter-spacing:-0.5px;line-height:1.25;}
.header p{font-size:12.5px;opacity:0.75;margin-top:6px;max-width:520px;line-height:1.55;}
.header-meta{text-align:right;opacity:0.5;font-size:10px;font-family:'DM Mono',monospace;line-height:1.8;}
.progress{margin-top:16px;display:flex;gap:3px;}
.progress-dot{flex:1;height:3px;border-radius:2px;cursor:pointer;transition:background 0.2s;}
.progress-dot.active{background:rgba(255,255,255,0.8);}
.progress-dot.inactive{background:rgba(255,255,255,0.15);}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden;}
.sidebar{width:220px;background:#fff;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;}
.sidebar-btn{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;padding:9px 20px;cursor:pointer;text-align:left;border-left:3px solid transparent;transition:all 0.15s;font-family:inherit;}
.sidebar-btn.active{background:rgba(14,124,123,0.05);border-left-color:var(--teal);}
.sidebar-btn .num{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-light);font-weight:500;width:20px;}
.sidebar-btn.active .num{color:var(--teal);}
.sidebar-btn .lbl{font-size:12.5px;font-weight:500;color:var(--text-mid);}
.sidebar-btn.active .lbl{font-weight:700;color:var(--navy);}
.content{flex:1;overflow-y:auto;padding:28px 36px 80px;}
.content-inner{max-width:740px;margin:0 auto;}

/* SECTION TITLE */
.sec-title{margin-bottom:28px;}
.sec-title-row{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;}
.sec-title .num{font-family:'DM Mono',monospace;font-size:13px;color:var(--teal);font-weight:500;}
.sec-title h2{font-size:24px;font-weight:700;color:var(--navy);letter-spacing:-0.5px;line-height:1.2;}
.sec-title .sub{font-size:13.5px;color:var(--text-mid);margin:4px 0 0 36px;line-height:1.6;max-width:600px;}
.sec-title .bar{width:50px;height:3px;background:var(--teal);margin-top:14px;border-radius:2px;margin-left:36px;}

/* CARD */
.card{background:var(--card);border-radius:8px;border:1px solid var(--border);margin-bottom:18px;overflow:hidden;box-shadow:0 1px 3px rgba(12,35,64,0.04);}
.card-header{padding:14px 22px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:10px;}
.card-header .icon{font-size:17px;}
.card-header .title{font-weight:700;font-size:14px;letter-spacing:-0.2px;}
.card-body{padding:18px 22px;font-size:13.5px;line-height:1.7;}
.card-body.no-pad{padding:0;}

/* CALLOUT */
.callout{border-left:3px solid;border-radius:0 6px 6px 0;padding:12px 16px;margin:14px 0;font-size:12.5px;line-height:1.65;display:flex;gap:10px;align-items:flex-start;}
.callout .ico{font-size:14px;flex-shrink:0;margin-top:1px;}
.callout-info{background:#E8F4F8;border-color:var(--teal);color:#0A5E5D;}
.callout-warn{background:#FEF7E6;border-color:var(--amber);color:#8B6914;}
.callout-akuo{background:#FFF4EC;border-color:#D4692A;color:#8B4513;}
.callout-key{background:#EFF6FF;border-color:#3B82F6;color:#1E40AF;}
.callout-so{background:#F0FDF4;border-color:var(--green);color:#14532D;}

/* DEF */
.def{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--border-light);}
.def-term{font-weight:700;font-size:12.5px;color:var(--navy);min-width:130px;flex-shrink:0;}
.def-val{font-size:12.5px;color:var(--text-mid);line-height:1.6;}

/* MINITAG */
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;margin-right:4px;margin-bottom:4px;}

/* EXPAND */
.expand{border:1px solid var(--border-light);border-radius:6px;margin-top:10px;overflow:hidden;}
.expand-btn{width:100%;border:none;background:#FAFBFC;padding:10px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;color:var(--navy);text-align:left;font-family:inherit;}
.expand-btn.open{background:var(--highlight);}
.expand-btn .arrow{font-size:16px;color:var(--text-light);transition:transform 0.2s;}
.expand-btn.open .arrow{transform:rotate(180deg);}
.expand-body{padding:14px 16px;font-size:12.5px;line-height:1.65;border-top:1px solid var(--border-light);display:none;}
.expand-body.open{display:block;}

/* FLOW */
.flow-box{color:#fff;border-radius:6px;padding:7px 10px;text-align:center;min-width:80px;font-size:10.5px;font-weight:600;line-height:1.3;flex-shrink:0;}
.flow-box .sub{font-size:9px;font-weight:400;opacity:0.8;margin-top:2px;}
.flow-arrow{display:flex;align-items:center;padding:0 3px;flex-shrink:0;}
.flow-arrow-line{width:16px;height:2px;background:var(--border);}
.flow-arrow-head{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid var(--text-light);}

/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0;}

/* NAVIGATION */
.nav-footer{display:flex;justify-content:space-between;margin-top:32px;padding-top:20px;border-top:1px solid var(--border);}
.nav-btn{padding:8px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;}
.nav-prev{border:1px solid var(--border);background:#fff;color:var(--text-mid);font-weight:500;}
.nav-next{border:none;background:var(--navy);color:#fff;font-weight:600;}

/* KPI TABLE */
.kpi-table{background:#F8FAFC;border-radius:6px;overflow:hidden;margin-bottom:14px;border:1px solid var(--border-light);}
.kpi-row{display:flex;padding:8px 14px;border-bottom:1px solid var(--border-light);align-items:center;}
.kpi-row:last-child{border-bottom:none;}
.kpi-label{width:120px;font-weight:600;font-size:11.5px;flex-shrink:0;}
.kpi-value{width:120px;font-weight:700;font-size:12.5px;color:var(--navy);flex-shrink:0;font-family:'DM Mono',monospace;}
.kpi-note{font-size:11px;color:var(--text-light);flex:1;}

/* ENTRY ROUTE CARD */
.entry-card{display:flex;gap:0;border-radius:8px;overflow:hidden;margin-bottom:10px;}
.entry-left{color:#fff;padding:16px 14px;min-width:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.entry-left .ico{font-size:28px;}
.entry-left .lbl{font-weight:700;font-size:14px;margin-top:6px;}
.entry-right{padding:14px 18px;flex:1;}

/* REVENUE STRIP */
.rev-strip{border-bottom:1px solid var(--border-light);}
.rev-strip:last-child{border-bottom:none;}
.rev-inner{display:flex;}
.rev-bar{width:6px;flex-shrink:0;}
.rev-content{padding:16px 22px;flex:1;}
.rev-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px;}
.rev-risk{font-family:'DM Mono',monospace;font-size:12px;}
.rev-footer{padding:12px 22px;background:#FAFBFC;display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;color:var(--text-light);}

/* SVG CONTAINER */
.svg-wrap{background:#F8FAFC;border-radius:8px;padding:16px 10px 8px;margin:12px 0;overflow-x:auto;}
.svg-wrap svg{width:100%;max-width:480px;display:block;margin:0 auto;}
.svg-caption{font-size:11px;color:var(--text-mid);text-align:center;margin-top:4px;line-height:1.5;padding:0 10px;}
.svg-label{font-size:11px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;padding-left:10px;}
.svg-legend{display:flex;gap:8px;margin-top:8px;padding:0 10px;flex-wrap:wrap;}
.svg-legend-item{display:flex;gap:6px;align-items:flex-start;font-size:10.5px;color:var(--text-mid);line-height:1.4;}
.svg-legend-dot{width:8px;height:8px;border-radius:2px;margin-top:2px;flex-shrink:0;}

/* COLORED BLOCKS */
.block{border-radius:8px;padding:14px;}
.block-top{border-top-width:3px;border-top-style:solid;}
.block-left{border-left-width:4px;border-left-style:solid;}

/* PROS CONS */
.pros{background:#F0FDF4;border-radius:6px;padding:10px 14px;}
.pros .h{font-size:11px;font-weight:700;color:var(--green);}
.cons{background:#FEF2F2;border-radius:6px;padding:10px 14px;}
.cons .h{font-size:11px;font-weight:700;color:var(--red);}
.pros .txt,.cons .txt{font-size:11.5px;color:var(--text);margin-top:3px;line-height:1.55;}

.metric-badge{font-size:11px;border-radius:4px;padding:6px 10px;font-weight:500;font-family:'DM Mono',monospace;}

/* NUMBERED CIRCLE */
.num-circle{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
.num-circle-sm{width:18px;height:18px;border-radius:3px;font-size:10px;}

/* DOT LIST */
.dot-item{font-size:11.5px;padding:3px 0;display:flex;gap:6px;align-items:flex-start;line-height:1.4;}
.dot{width:4px;height:4px;border-radius:50%;flex-shrink:0;margin-top:5px;}

@media(max-width:900px){
  .sidebar{display:none;}
  .content{padding:20px 16px 60px;}
  .g3,.g4{grid-template-columns:1fr 1fr;}
  .entry-card{flex-direction:column;}
  .entry-left{flex-direction:row;min-width:auto;padding:12px 14px;gap:10px;}
}
@media(max-width:600px){
  .g2,.g3,.g4{grid-template-columns:1fr;}
  .header{padding:16px 16px 14px;}
  .header h1{font-size:18px;}
  .rev-header{flex-direction:column;align-items:flex-start;}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div>
      <div class="header-tag">CVA × Akuo · Onboarding consultant</div>
      <h1>Fondamentaux du marché de l'énergie renouvelable</h1>
      <p>Guide interactif — de la formation des prix de l'électricité à la structuration d'un portefeuille d'IPP. Conçu pour la mission Akuo 2030 Strategic Plan.</p>
    </div>
    <div class="header-meta">Confidentiel<br>Mars 2026<br>v2.0</div>
  </div>
  <div class="progress" id="progress"></div>
</div>

<!-- LAYOUT -->
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content">
    <div class="content-inner" id="content-inner"></div>
  </div>
</div>

<script>
const SECTIONS = [
  {id:"intro",label:"Vue d'ensemble",num:"00"},
  {id:"market",label:"Marché électrique",num:"01"},
  {id:"tech",label:"Technologies",num:"02"},
  {id:"revenue",label:"Revenue stack",num:"03"},
  {id:"lifecycle",label:"Cycle de projet",num:"04"},
  {id:"grid",label:"Réseau & permitting",num:"05"},
  {id:"finance",label:"Finance de projet",num:"06"},
  {id:"competition",label:"Concurrence",num:"07"},
  {id:"portfolio",label:"Effets de portefeuille",num:"08"},
  {id:"akuo",label:"Mission Akuo",num:"09"},
  {id:"method",label:"Méthodologie CVA",num:"10"},
];

let activeSection = "intro";

function navigate(id) {
  activeSection = id;
  render();
  document.getElementById('content').scrollTop = 0;
}

function toggleExpand(btn) {
  btn.classList.toggle('open');
  btn.nextElementSibling.classList.toggle('open');
}

// ── HELPERS ──
function callout(type, icon, html) {
  return `<div class="callout callout-${type}"><span class="ico">${icon}</span><div>${html}</div></div>`;
}
function def(term, html) {
  return `<div class="def"><div class="def-term">${term}</div><div class="def-val">${html}</div></div>`;
}
function tag(text, color) {
  return `<span class="tag" style="background:${color}14;color:${color}">${text}</span>`;
}
function expand(title, html) {
  return `<div class="expand"><button class="expand-btn" onclick="toggleExpand(this)">${title}<span class="arrow">▾</span></button><div class="expand-body">${html}</div></div>`;
}
function flowBox(label, sub, color) {
  return `<div class="flow-box" style="background:${color}">${label}${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}
function flowArrow() {
  return `<div class="flow-arrow"><div class="flow-arrow-line"></div><div class="flow-arrow-head"></div></div>`;
}
function secTitle(num, title, subtitle) {
  return `<div class="sec-title"><div class="sec-title-row"><span class="num">${num}</span><h2>${title}</h2></div>${subtitle?`<p class="sub">${subtitle}</p>`:''}<div class="bar"></div></div>`;
}
function card(title, icon, accent, body, noPad) {
  return `<div class="card"><div class="card-header" style="background:${accent}08"><span class="icon">${icon}</span><span class="title" style="color:${accent}">${title}</span></div><div class="card-body${noPad?' no-pad':''}">${body}</div></div>`;
}

// ── MERIT ORDER SVG ──
function meritOrderSVG() {
  const techs=[{n:"Nucl.",c:12,mw:63,col:"#6B21A8"},{n:"Hydro",c:5,mw:25,col:"#0369A1"},{n:"Éolien",c:0,mw:35,col:"#059669"},{n:"Solaire",c:0,mw:45,col:"#D97706"},{n:"CCGT",c:45,mw:40,col:"#DC2626"},{n:"TAC",c:80,mw:15,col:"#991B1B"}];
  const W=480,H=200,pl=50,pr=20,pt=20,pb=40,cW=W-pl-pr,cH=H-pt-pb,maxC=95,totalMW=techs.reduce((s,t)=>s+t.mw,0);
  let cumX=0,bars='';
  techs.forEach(t=>{
    const bW=(t.mw/totalMW)*cW,bH=Math.max(((t.c+8)/maxC)*cH,14),x=pl+cumX,y=pt+cH-bH;
    bars+=`<rect x="${x+1}" y="${y}" width="${bW-2}" height="${bH}" fill="${t.col}" rx="2" opacity="0.9"/>`;
    bars+=`<text x="${x+bW/2}" y="${y+bH/2+1}" text-anchor="middle" dominant-baseline="middle" font-size="8" fill="#fff" font-weight="600" font-family="DM Sans">${t.n}</text>`;
    bars+=`<text x="${x+bW/2}" y="${y-5}" text-anchor="middle" font-size="7.5" fill="${t.col}" font-weight="500" font-family="DM Mono">${t.c===0?'≈0':t.c}€</text>`;
    cumX+=bW;
  });
  const dX=pl+(180/totalMW)*cW,mY=pt+cH-(45/maxC)*cH;
  let grid='';
  [20,40,60,80].forEach(v=>{const y=pt+cH-(v/maxC)*cH;grid+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--border-light)" stroke-width="0.5" stroke-dasharray="3,3"/><text x="${pl-6}" y="${y+3}" text-anchor="end" font-size="8" fill="var(--text-light)" font-family="DM Mono">${v}</text>`;});
  return `<div class="svg-wrap"><svg viewBox="0 0 ${W} ${H}"><line x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}" stroke="var(--border)" stroke-width="1.5"/><line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="var(--border)" stroke-width="1.5"/><text x="14" y="${H/2}" text-anchor="middle" font-size="8.5" fill="var(--text-light)" transform="rotate(-90,14,${H/2})" font-family="DM Sans">€/MWh</text><text x="${W/2}" y="${H-6}" text-anchor="middle" font-size="8.5" fill="var(--text-light)" font-family="DM Sans">Capacité cumulée (GW)</text>${grid}${bars}<line x1="${dX}" y1="${pt-5}" x2="${dX}" y2="${H-pb+5}" stroke="var(--navy)" stroke-width="1.5" stroke-dasharray="5,3"/><text x="${dX+4}" y="${pt+8}" font-size="8" fill="var(--navy)" font-weight="600" font-family="DM Sans">Demande</text><line x1="${pl}" y1="${mY}" x2="${dX}" y2="${mY}" stroke="var(--red)" stroke-width="1" stroke-dasharray="3,2"/><circle cx="${dX}" cy="${mY}" r="3.5" fill="var(--red)"/><text x="${pl+4}" y="${mY-5}" font-size="7.5" fill="var(--red)" font-weight="600" font-family="DM Sans">Prix spot = 45 €/MWh</text></svg><div class="svg-caption">La dernière centrale appelée (CCGT ici) fixe le prix pour <em>toutes</em> les centrales. Solaire & éolien (coût marginal ≈ 0) captent la totalité du prix spot comme marge brute.</div></div>`;
}

// ── DUCK CURVE SVG ──
function duckCurveSVG() {
  const W=480,H=180,pl=45,pr=20,pt=25,pb=35,cW=W-pl-pr,cH=H-pt-pb;
  const demand=[52,48,45,44,43,44,52,62,65,63,60,58,57,56,55,56,60,68,72,70,65,60,56,53];
  const solar=[0,0,0,0,0,0,0,2,12,22,30,35,36,34,28,18,8,1,0,0,0,0,0,0];
  const net=demand.map((d,i)=>d-solar[i]);
  const maxV=80,toX=i=>pl+(i/23)*cW,toY=v=>pt+cH-(v/maxV)*cH;
  const pathD=arr=>arr.map((v,i)=>(i===0?'M':'L')+toX(i).toFixed(1)+','+toY(v).toFixed(1)).join(' ');
  const solarFill='M'+toX(0).toFixed(1)+','+toY(0).toFixed(1)+' '+solar.map((v,i)=>'L'+toX(i).toFixed(1)+','+toY(v).toFixed(1)).join(' ')+' L'+toX(23).toFixed(1)+','+toY(0).toFixed(1)+' Z';
  let hours='';[0,6,12,18,23].forEach(h=>{hours+=`<text x="${toX(h).toFixed(1)}" y="${H-pb+14}" text-anchor="middle" font-size="8" fill="var(--text-light)" font-family="DM Mono">${h}h</text>`;});
  return `<div class="svg-wrap"><div class="svg-label">Courbe de canard (Duck Curve) — profil journalier type</div><svg viewBox="0 0 ${W} ${H}"><line x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}" stroke="var(--border)" stroke-width="1"/><line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="var(--border)" stroke-width="1"/>${hours}<text x="14" y="${H/2}" text-anchor="middle" font-size="8" fill="var(--text-light)" transform="rotate(-90,14,${H/2})" font-family="DM Sans">GW</text><path d="${solarFill}" fill="#D9770622"/><path d="${pathD(demand)}" fill="none" stroke="var(--navy)" stroke-width="2"/><path d="${pathD(net)}" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="5,3"/><path d="${pathD(solar)}" fill="none" stroke="#D97706" stroke-width="1.5"/><text x="${toX(20).toFixed(1)}" y="${(toY(demand[20])-6).toFixed(1)}" font-size="8" fill="var(--navy)" font-weight="600" font-family="DM Sans">Demande brute</text><text x="${(toX(18)+10).toFixed(1)}" y="${(toY(net[18])+14).toFixed(1)}" font-size="8" fill="var(--amber)" font-weight="600" font-family="DM Sans">Demande résiduelle</text><text x="${toX(12).toFixed(1)}" y="${(toY(solar[12])-6).toFixed(1)}" font-size="8" fill="#D97706" font-weight="600" font-family="DM Sans">Production solaire</text><line x1="${toX(17).toFixed(1)}" y1="${toY(net[17]).toFixed(1)}" x2="${toX(17).toFixed(1)}" y2="${toY(demand[17]).toFixed(1)}" stroke="var(--red)" stroke-width="1" stroke-dasharray="2,2"/><text x="${(toX(17)+4).toFixed(1)}" y="${toY((net[17]+demand[17])/2).toFixed(1)}" font-size="7" fill="var(--red)" font-weight="600" font-family="DM Sans">Rampe</text></svg><div class="svg-legend"><div class="svg-legend-item"><div class="svg-legend-dot" style="background:#D97706"></div>Creux solaire : prix s'effondrent en milieu de journée</div><div class="svg-legend-item"><div class="svg-legend-dot" style="background:var(--amber)"></div>Rampe du soir : montée brutale de demande résiduelle → prix peak</div><div class="svg-legend-item"><div class="svg-legend-dot" style="background:var(--red)"></div>Volatilité intra-day = opportunité pour le stockage (arbitrage)</div></div></div>`;
}

// ═══════════════════════════════════════════════════
// SECTIONS
// ═══════════════════════════════════════════════════

const CONTENT = {};

CONTENT.intro = () => secTitle('00','Vue d\'ensemble','De développeur pur à IPP intégré — le shift fondamental qui sous-tend toute la mission Akuo')
+ card("Qu'est-ce qu'un IPP ?","🏗️","var(--navy)",`
<p>Un <strong>Independent Power Producer (IPP)</strong> est un acteur privé qui développe, finance, construit et exploite des centrales de production d'électricité. Le terme couvre un spectre large :</p>
<div class="g3">
  <div class="block block-top" style="background:#3B82F608;border-top-color:#3B82F6">${tag('Asset-light','#3B82F6')}<div style="font-weight:700;font-size:13px;color:#3B82F6;margin:6px 0 4px">Développeur pur</div><div style="font-size:11.5px;color:var(--text-mid);line-height:1.55">Développe le projet puis vend le SPV avant ou après construction. Revenus = marge de développement. Peu de capital immobilisé.</div></div>
  <div class="block block-top" style="background:var(--teal)08;border-top-color:var(--teal)">${tag('Transition','#0E7C7B')}<div style="font-weight:700;font-size:13px;color:var(--teal);margin:6px 0 4px">IPP semi-intégré</div><div style="font-size:11.5px;color:var(--text-mid);line-height:1.55">Conserve certains actifs, en vend d'autres (build, partially hold). Equity sélective. Revenus mixtes.</div></div>
  <div class="block block-top" style="background:var(--navy)08;border-top-color:var(--navy)">${tag('Asset-heavy','#0C2340')}<div style="font-weight:700;font-size:13px;color:var(--navy);margin:6px 0 4px">IPP intégré</div><div style="font-size:11.5px;color:var(--text-mid);line-height:1.55">Conserve les actifs, injecte de l'equity, capte les revenus d'exploitation sur 20-30 ans. WACC = avantage compétitif.</div></div>
</div>
${callout('akuo','🎯','<strong>Akuo pré-Ardian :</strong> développeur pur — maximisation des revenus de développement, peu d\'equity. <strong>Post-Ardian (juillet 2025) :</strong> bascule vers IPP intégré, equity at stake. Les critères changent : ce n\'est plus la marge de dev qui compte mais le <strong>project IRR vs. hurdle rate</strong> et la <strong>récurrence des cash flows</strong>.')}
`)
+ card("Chaîne de valeur d'un projet renouvelable","⛓️","var(--teal)",`
<div style="overflow-x:auto;padding:10px 0"><div style="display:flex;align-items:center;gap:4px;min-width:650px">
  ${flowBox('Origination','Site, foncier, études','var(--navy)')}${flowArrow()}${flowBox('Développement','Permitting, études, grid','var(--navy-light)')}${flowArrow()}${flowBox('FID','Go/No-go','var(--amber)')}${flowArrow()}${flowBox('Construction','EPC, procurement','var(--teal)')}${flowArrow()}${flowBox('COD','Mise en service','var(--green)')}${flowArrow()}${flowBox('Exploitation','O&M, monitoring, OT','#0D9488')}${flowArrow()}${flowBox('Vente d\'énergie','Revenue stack, EMS','var(--amber)')}
</div></div>
<div class="g2">
  <div style="background:#FEF2F2;border-radius:6px;padding:10px 14px"><div style="font-size:11.5px;font-weight:700;color:var(--red)">← Phase cash-out (2-7 ans)</div><div style="font-size:11px;color:var(--text-mid);margin-top:2px">Dépenses sans revenus. Capital à risque. Time-to-COD = variable critique.</div></div>
  <div style="background:#F0FDF4;border-radius:6px;padding:10px 14px"><div style="font-size:11.5px;font-weight:700;color:var(--green)">Phase cash-in (20-35 ans) →</div><div style="font-size:11px;color:var(--text-mid);margin-top:2px">Revenus récurrents. Qualité dépend du revenue stack (secured vs. merchant).</div></div>
</div>
`)
+ card("Glossaire structurant","📖","var(--slate)",
  def('SPV','Special Purpose Vehicle — société projet dédiée à un seul actif. L\'unité de base du M&A dans les renouvelables : on achète/vend le SPV, pas l\'actif physique.')
  +def('EPC','Engineering, Procurement & Construction — contrat clé en main de construction. Le contractant assume le risque de coût et de délai (lump sum turnkey).')
  +def('O&M','Operations & Maintenance — maintenance préventive et corrective, surveillance des équipements. Peut être internalisé ou externalisé (OEM ou tiers).')
  +def('OT','Operational Technology — couche de contrôle temps réel : SCADA, capteurs, automatisation. Critique pour la performance et le monitoring à distance.')
  +def('EMS','Energy Management System — optimisation en temps réel du dispatch, trading intra-day, participation aux marchés de flexibilité. Le « cerveau » de la valorisation.')
  +def('COD','Commercial Operation Date — date de mise en service commerciale. Point d\'inflexion cash-out → cash-in.')
  +def('FID','Final Investment Decision — décision de lancer la construction. Pré-requis : permis, financement, offtake sécurisé.')
);

CONTENT.market = () => secTitle('01','Marché électrique','Comment se forme le prix de l\'électricité, et pourquoi c\'est le point de départ de toute analyse renouvelable')
+ card("Le merit order : formation des prix spot","📊","var(--navy)",`
<p>L'électricité se vend sur un marché de gros (wholesale) où le prix est fixé <strong>heure par heure</strong> par le merit order. Les centrales sont classées par coût marginal croissant et appelées dans cet ordre. La dernière unité appelée — la <em>marginale</em> — fixe le prix pour toutes.</p>
${meritOrderSVG()}
${callout('key','🔑','<strong>Conséquence fondamentale :</strong> les ENR (coût marginal ≈ 0) sont toujours appelées en premier. Elles ne fixent pas le prix — elles le subissent. Leur rentabilité dépend du prix fixé par les fossiles marginales. Plus il y a d\'ENR, plus elles poussent les fossiles hors du merit order → le prix baisse → <strong>effet de cannibalization</strong>.')}
`)
+ card("Duck curve et volatilité intra-day","🦆","var(--amber)",`
<p>La pénétration massive du solaire crée un profil caractéristique de la demande résiduelle (demande brute – production ENR), surnommé la « duck curve » :</p>
${duckCurveSVG()}
${callout('info','💡','<strong>Pourquoi c\'est stratégique :</strong> La duck curve crée un spread intra-day entre prix creux (midi) et prix peak (rampe du soir). Ce spread est la raison d\'être économique du <strong>stockage batterie</strong> : acheter aux creux, revendre aux peaks.')}
`)
+ card("Capture price vs. wholesale price","⚠️","var(--red)",`
<p>La distinction la plus critique pour la rentabilité réelle :</p>
<div class="g2">
  <div class="block block-top" style="background:var(--navy)08;border-top-color:var(--navy)"><div style="font-weight:700;font-size:13px;color:var(--navy)">Prix wholesale moyen</div><div style="font-size:11.5px;color:var(--text-mid);margin-top:4px;line-height:1.55">Moyenne arithmétique du prix spot sur toutes les heures (baseload). Le prix « titre » du marché.</div></div>
  <div class="block block-top" style="background:var(--amber)12;border-top-color:var(--amber)"><div style="font-weight:700;font-size:13px;color:var(--amber)">Capture price</div><div style="font-size:11.5px;color:var(--text-mid);margin-top:4px;line-height:1.55">Moyenne du prix spot <strong>pondérée par le profil de production</strong> réel. Le prix que le producteur capte <em>réellement</em>. Toujours ≤ wholesale pour ENR.</div></div>
</div>
<p>Le <strong>capture ratio</strong> = capture price / wholesale price. Un ratio de 0.75 = le solaire ne capte que 75% du prix moyen. Ce ratio se dégrade avec la pénétration — c'est la <strong>cannibalization</strong>.</p>
<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:10px 0;padding:12px;background:#FFF7ED;border-radius:6px;border:1px solid #FED7AA">
  ${flowBox('+ de solaire','','#D97706')}${flowArrow()}${flowBox('Production corrélée','','#B45309')}${flowArrow()}${flowBox('Prix bas midi','','#92400E')}${flowArrow()}${flowBox('Capture price ↓','','#78350F')}
</div>
${expand('📐 Prix négatifs — quand le producteur paie pour injecter','<p>Dans les marchés matures (Allemagne, Espagne, Australie), les prix spot deviennent <strong>négatifs</strong> certaines heures : les producteurs <em>paient</em> pour injecter. Raison : production ENR + nucléaire (inflexible) > demande, et les coûts d\'arrêt/redémarrage > perte liée aux prix négatifs.</p><p style="margin-top:8px"><strong>Impact :</strong> les contrats CfD/complément de rémunération suspendent souvent les paiements pendant les heures de prix négatifs. Un projet avec 5-10% d\'heures à prix négatif voit sa rentabilité significativement impactée.</p>')}
${expand('📐 Basis risk et marchés zonaux','<p>Dans un marché <strong>zonal</strong> (Nordics, Italie), le prix diffère par zone géographique selon les congestions réseau. Le <strong>basis risk</strong> = risque que le prix local ≠ le prix du contrat de couverture (souvent indexé sur le prix national/hub). Un PPA indexé sur le prix national ne protège pas contre un effondrement local.</p>')}
`);

function techCard(name, icon, color, kpis, strengths, risks, so_what) {
  let kpiHtml = kpis.map(([k,v,n],i) => `<div class="kpi-row"><div class="kpi-label" style="color:${color}">${k}</div><div class="kpi-value">${v}</div><div class="kpi-note">${n}</div></div>`).join('');
  return card(`${icon} ${name}`, icon, color, `
<div class="kpi-table">${kpiHtml}</div>
<div class="g2">
  <div class="pros"><div class="h">✓ Forces</div><div class="txt">${strengths}</div></div>
  <div class="cons"><div class="h">✗ Risques</div><div class="txt">${risks}</div></div>
</div>
${callout('so','→','<strong>So what :</strong> '+so_what)}
`, false);
}

CONTENT.tech = () => secTitle('02','Technologies','Solaire PV, éolien onshore et stockage batterie — les trois actifs du périmètre Akuo')
+ techCard('Solaire PV','☀️','#D97706',[['Load factor','12-22%','Ratio énergie produite / capacité max théorique'],['CAPEX','500-700 €/kWc','Utility-scale, 2025'],['LCOE','30-55 €/MWh','Plus bas que le CCGT dans la plupart des marchés'],['Durée de vie','30-35 ans','Dégradation ~0.4%/an'],['Time to permit','1-4 ans','1 an Pologne, 3-4 ans France']],'LCOE le plus bas, rapidité de construction (6-12 mois post-FID), modularité (1 MW à 500 MW), risque technique quasi-nul.','Cannibalization forte (capture ratio en baisse), production concentrée midi, dépendance foncière (5-7 ha/MWc).','Technologie par défaut. La question est « à quel capture price » et « quelle route-to-market pour protéger les revenus ».')
+ techCard('Éolien onshore','🌬️','#0369A1',[['Load factor','22-35%','Dépend du site et hauteur de mât'],['CAPEX','1 000-1 400 €/kW','Turbines 5-7 MW onshore, 2025'],['LCOE','40-70 €/MWh','Plus élevé mais meilleur capture price'],['Durée de vie','25-30 ans','Repowering possible à mi-vie'],['Time to permit','3-7 ans','Goulot n°1 en Europe de l\'Ouest']],'Profil complémentaire au solaire (hiver, nuit) → meilleur capture ratio. Repowering des sites matures = pipeline à moindre risque.','Acceptabilité sociale (bruit, paysage, biodiversité), permitting long et contentieux, recours juridiques (~20-30% annulation en France).','Moins de volume que le solaire, mais capture price supérieur. Le right to win dépend de la capacité locale de permitting.')
+ techCard('Stockage batterie (BESS)','🔋','#7C3AED',[['Technologie','Li-ion LFP','Dominant pour stationnaire (durée, sécurité, coût)'],['CAPEX','200-350 €/kWh','Divisé par 3 en 5 ans'],['Durée typique','1-4 heures','2h standard, 4h pour capacity/arbitrage'],['Cycles de vie','5 000-8 000','~15-20 ans pour 1 cycle/jour'],['Revenue model','Value stacking','Empilement de services multiples']],'Actif de flexibilité par excellence. Multiples revenue streams (arbitrage, FCR, aFRR, capacity, tolling). Co-location = améliore le capture price du parc ENR.','Business model complexe, revenues non contractualisables long terme (sauf tolling), dégradation des ancillary revenues avec montée BESS installé.','Pas une 4ème technologie comparable — c\'est un actif d\'optimisation de portefeuille. Sa valeur dépend du market design et de la volatilité des prix.')
+ card("Co-location et actifs hybrides","🔗","var(--teal)",`
<p>La <strong>co-location</strong> = stockage installé sur le même site qu'un parc ENR, partageant le raccordement réseau. Triple avantage :</p>
<div class="g3">
  <div class="block block-top" style="background:var(--amber)08;border-top-color:var(--amber)"><div style="font-weight:700;font-size:11.5px;color:var(--amber);margin-bottom:4px">Capture price amélioré</div><div style="font-size:11px;color:var(--text-mid);line-height:1.5">Le BESS stocke la surproduction midi et revend au peak du soir → le parc capte le prix peak.</div></div>
  <div class="block block-top" style="background:var(--teal)08;border-top-color:var(--teal)"><div style="font-weight:700;font-size:11.5px;color:var(--teal);margin-bottom:4px">Coûts partagés</div><div style="font-size:11px;color:var(--text-mid);line-height:1.5">Un seul raccordement, un seul poste de transfo, un seul O&M → économies CAPEX + OPEX.</div></div>
  <div class="block block-top" style="background:var(--green)08;border-top-color:var(--green)"><div style="font-weight:700;font-size:11.5px;color:var(--green);margin-bottom:4px">Curtailment évité</div><div style="font-size:11px;color:var(--text-mid);line-height:1.5">Si le réseau sature, le BESS absorbe l'excédent au lieu de le perdre.</div></div>
</div>`);

CONTENT.revenue = () => secTitle('03','Revenue stack','Les quatre routes-to-market — du plus sécurisé au plus exposé au prix de marché')
+ `<div class="card"><div class="card-header" style="background:var(--green)08"><span class="icon">💰</span><span class="title" style="color:var(--green)">L'empilement des revenus</span></div><div class="card-body no-pad"><div style="padding:16px 22px"><p>Le <strong>revenue stack</strong> = combinaison de contrats et d'expositions de marché qui monétisent la production. Axe n°3 de la segmentation CVA.</p></div>`
+ [{l:"Support public / auction",r:1,c:"var(--green)",b:"Très élevée",d:"Tarif garanti par appel d'offres public : FiT, CfD ou complément de rémunération. Durée 15-20 ans. Revenus totalement prévisibles.",det:"FiT = tarif fixe complet. CfD = strike price, settlement vs. spot. Complément de rémunération = prime au-dessus du spot (France, CRE)."},{l:"PPA privé (corporate / utility)",r:2,c:"var(--teal)",b:"Élevée",d:"Contrat bilatéral long terme (7-15 ans) avec industriel ou utility. Prix fixe ou indexé.",det:"Structures : pay-as-produced (risque volume au buyer), baseload PPA (profil plat → balancing), virtual/financial PPA (settlement financier). Qualité counterparty = bankabilité."},{l:"Hybride (secured + merchant)",r:3,c:"var(--amber)",b:"Modérée",d:"Part contractualisée + part en exposition merchant. Équilibre risque/upside.",det:"Ratio typique 50-70% secured / 30-50% merchant. La partie secured bankabilise, la partie merchant offre l'upside."},{l:"Merchant + value stacking",r:4,c:"var(--red)",b:"Faible",d:"100% exposé au prix spot. Pas de contrat long terme.",det:"Vente day-ahead ou intra-day + ancillary services (FCR/aFRR/mFRR) + capacity market + tolling. Le value stacking = empiler ces revenus."}].map((r,i)=>`<div class="rev-strip"><div class="rev-inner"><div class="rev-bar" style="background:${r.c}"></div><div class="rev-content"><div class="rev-header"><div style="font-weight:700;font-size:14px;color:${r.c}">${r.l}</div><div style="display:flex;gap:8px;align-items:center"><span style="font-size:10.5px;color:var(--text-light)">Risque</span><span class="rev-risk">${'●●●●'.split('').map((_,j)=>`<span style="color:${j<r.r?r.c:'var(--border-light)'}">●</span>`).join('')}</span><span style="font-size:10.5px;color:var(--text-light);margin-left:8px">Bankabilité : <strong>${r.b}</strong></span></div></div><p style="font-size:12.5px;line-height:1.6;color:var(--text);margin:0">${r.d}</p>${expand('Détail : structures et mécanismes','<p>'+r.det+'</p>')}</div></div></div>`).join('')
+ `<div class="rev-footer"><span>← Visibilité long terme · Bankabilité · Levier dette élevé</span><span>Upside potentiel · Exposition prix · Compétences trading →</span></div></div></div>`
+ card("Glossaire des mécanismes","📖","var(--slate)",
  def('FiT','Feed-in Tariff — tarif d\'achat garanti 15-20 ans. En voie de disparition pour les grandes centrales.')
  +def('CfD','Contract for Difference — strike price fixé par auction, settlement vs. spot. Protège producteur ET consommateur.')
  +def('Ancillary services','FCR (fréquence primaire, secondes), aFRR (réserve automatique, minutes), mFRR (réserve manuelle). Le BESS excelle sur FCR/aFRR.')
  +def('Capacity market','Rémunération pour être disponible en cas de pic. UK, France, Pologne.')
  +def('Tolling','Le propriétaire du BESS met l\'actif à disposition d\'un trader contre un loyer fixe.')
  +def('Shape risk','Décalage profil production (intermittent) vs. profil livraison (baseload PPA). Coût de balancing.')
);

function entryRoute(icon, label, color, desc, pros, cons, metric) {
  return `<div class="entry-card" style="border:1px solid ${color}22"><div class="entry-left" style="background:${color}"><span class="ico">${icon}</span><div class="lbl">${label}</div></div><div class="entry-right"><p style="font-size:12.5px;line-height:1.6;color:var(--text);margin:0 0 10px">${desc}</p><div class="g2"><div class="pros"><div class="h">✓ Avantages</div><div class="txt">${pros}</div></div><div class="cons"><div class="h">✗ Limites</div><div class="txt">${cons}</div></div></div><div class="metric-badge" style="background:${color}0A;color:${color}">${metric}</div></div></div>`;
}

CONTENT.lifecycle = () => secTitle('04','Cycle de projet & entry routes','Les trois chemins pour constituer un portefeuille et les métriques de coût / temps associées')
+ card("Les 3 entry routes","🔄","var(--navy)",
  entryRoute('🌱','Greenfield','var(--green)','Développement from scratch : site, foncier (bail emphytéotique 30-40 ans), permis, raccordement, construction.','Meilleur contrôle sur design et coûts. Marge de développement captée. Calibrage actif sur le revenue stack visé.','Time-to-COD long (3-7 ans). DEVEX à risque si le projet échoue. Hit rate < 100%.','DEVEX : 30-100 k€/MW · Hit rate : 30-70%')
  +entryRoute('🔧','Brownfield / Repowering','var(--teal)','Reprendre un site existant pour moderniser (repowering = remplacement turbines) ou augmenter la capacité. Foncier sécurisé, grid existant, permitting simplifié.','Time-to-COD réduit (1-3 ans). Risque permitting atténué. Repowering éolien peut doubler la production avec moins de turbines.','Disponibilité limitée (parc vieillissant). Négociation propriétaire. Contraintes techniques héritées.','DEVEX : 15-50 k€/MW · Time-to-COD : 1-3 ans')
  +entryRoute('🤝','M&A / Platform build-up','var(--navy)','Racheter des SPV (projets), un portefeuille d\'actifs ou une plateforme entière (équipe + pipeline + actifs). Accès instantané au marché.','Pas de time-to-COD pour actifs en opération. Pipeline dérisqué. Acquisition équipe locale. Parfois seul moyen d\'entrer dans un nouveau marché.','Prime d\'acquisition. Risque d\'intégration. Due diligence coûteuse.','Premium : 100-300 k€/MW (RTB) · Closing : 3-6 mois')
  +callout('key','🔑','<strong>Question n°5 de la RFP :</strong> le ratio optimal greenfield / M&A par pays dépend du time-to-market cible, de la capacité locale de développement, du prix des actifs et de la maturité du pipeline existant.')
)
+ card("Métriques de coût et de temps","📐","var(--teal)",
  def('DEVEX','Development Expenditure — coûts pré-FID : études, permitting, foncier, consultants, juridique. 2-5% du CAPEX. Capital 100% à risque.')
  +def('CAPEX','Capital Expenditure — coût de construction : équipements, BOS, EPC, raccordement. En €/kWc, €/kW ou €/kWh.')
  +def('OPEX','Coûts d\'exploitation annuels : O&M, assurance, loyer foncier, monitoring, taxes. Internalisation O&M = -15-25% vs. contrat externe.')
  +def('Hit rate','% de projets atteignant COD. ~30% éolien France → ~70% solaire Pologne. Impacte le coût réel par MW sécurisé.')
  +def('Time to COD','Durée origination → COD. Chaque mois de retard = DEVEX porté plus longtemps + risque d\'obsolescence conditions marché.')
);

CONTENT.grid = () => secTitle('05','Réseau & permitting','Les deux goulots d\'étranglement du développement — accès réseau et autorisations administratives')
+ card("Accès au réseau : le goulot critique","🔌","#6B21A8",`
<p>Un actif ENR ne vaut <em>rien</em> sans connexion réseau. Le raccordement est le facteur limitant n°1 dans de nombreux marchés.</p>
${def('Grid connection','Raccordement physique au réseau transport (HTA/HTB) ou distribution. Nécessite demande formelle, étude de faisabilité, convention, travaux physiques.')}
${def('Queue / file d\'attente','Demande >> capacité dans beaucoup de pays. Italie ~200 GW en attente, Grèce ~45 GW. Les « queue raiders » bloquent le système.')}
${def('Curtailment','Ordre du TSO de réduire/stopper la production quand le réseau sature. 2-8% de production annuelle dans les zones congestionnées = revenus perdus.')}
${def('TSO / DSO','TSO = réseau haute tension national. DSO = réseau basse/moyenne tension local. ENR utility-scale → TSO ou HTA.')}
${def('Renforcement réseau','Investissements TSO pour augmenter la capacité de transport. Horizon 5-15 ans. Si à charge du développeur → impact CAPEX.')}
${callout('warn','⚠️','<strong>Enjeu stratégique :</strong> sécuriser du grid en avance = avantage compétitif majeur. Dans les marchés congestionnés, le point de raccordement peut valoir plus que le projet lui-même. Critère de « right to win » dans le Step 2.')}
`)
+ card("Permitting : le facteur temps et le facteur pays","📋","var(--navy)",`
<p>Le permitting est le processus d'obtention des autorisations. C'est le facteur n°1 de différenciation entre marchés.</p>
<div class="g4">
  <div class="block block-top" style="background:var(--green)08;border-top-color:var(--green)"><div style="font-size:16px;margin-bottom:4px">🌿</div><div style="font-weight:700;font-size:11.5px;color:var(--green);margin-bottom:4px">Environnement</div><div style="font-size:11px;color:var(--text-mid);line-height:1.5">Études d'impact, faune/flore, zones protégées. Friction n°1 pour l'éolien.</div></div>

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════

function render() {
  const idx = SECTIONS.findIndex(s=>s.id===activeSection);

  // Progress
  document.getElementById('progress').innerHTML = SECTIONS.map((s,i) =>
    `<div class="progress-dot ${i<=idx?'active':'inactive'}" onclick="navigate('${s.id}')"></div>`
  ).join('');

  // Sidebar
  document.getElementById('sidebar').innerHTML = '<div style="padding:12px 0">' + SECTIONS.map(s =>
    `<button class="sidebar-btn ${activeSection===s.id?'active':''}" onclick="navigate('${s.id}')"><span class="num">${s.num}</span><span class="lbl">${s.label}</span></button>`
  ).join('') + '</div>';

  // Content
  let nav = '<div class="nav-footer">';
  if(idx>0) nav+=`<button class="nav-btn nav-prev" onclick="navigate('${SECTIONS[idx-1].id}')">← ${SECTIONS[idx-1].label}</button>`;
  else nav+='<div></div>';
  if(idx<SECTIONS.length-1) nav+=`<button class="nav-btn nav-next" onclick="navigate('${SECTIONS[idx+1].id}')">${SECTIONS[idx+1].label} →</button>`;
  else nav+='<div></div>';
  nav+='</div>';

  document.getElementById('content-inner').innerHTML = CONTENT[activeSection]() + nav;
}

render();
</script>
